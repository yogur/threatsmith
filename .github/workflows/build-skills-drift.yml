name: "Skill Build Drift Guard"

on:
  push:
    paths:
      - "skills-src/**"
      - "scripts/build_skills.py"
      - "src/threatsmith/_build_skills.py"
  pull_request:
    paths:
      - "skills-src/**"
      - "scripts/build_skills.py"
      - "src/threatsmith/_build_skills.py"

jobs:
  drift-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Rebuild skills
        run: uv run python scripts/build_skills.py
      - name: Fail on drift
        run: |
          if ! git diff --exit-code build/skills/; then
            echo "build/skills/ is out of sync with skills-src/. Run: uv run python scripts/build_skills.py"
            exit 1
          fi
